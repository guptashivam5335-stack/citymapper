<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Mapper</title>
<style>
:root{--bg:#f6f5f1;--pn:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#d9d7ce;--ac:#1f6feb;--cv:#eceae2;--gr:#d8d6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--pn:#212326;--tx:#ececea;--mu:#9a9a94;--bd:#383a3e;--ac:#5b9bff;--cv:#1c1e20;--gr:#2c2e32}}
:root[data-theme="dark"]{--bg:#17181a;--pn:#212326;--tx:#ececea;--mu:#9a9a94;--bd:#383a3e;--ac:#5b9bff;--cv:#1c1e20;--gr:#2c2e32}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--pn);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h1{font-size:16px;margin:0}header span{color:var(--mu);font-size:12px}
main{flex:1;display:flex;min-height:0}
aside{width:260px;background:var(--pn);border-right:1px solid var(--bd);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 6px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%}textarea{height:70px;font:11px monospace}
label.l{display:flex;gap:6px;align-items:center;margin:2px 0}label.l input{width:auto}
.row{display:flex;gap:6px}.row button{flex:1}
.st{color:var(--mu);font-size:12px}.st b{color:var(--tx)}
#wrap{flex:1;position:relative;min-width:0}canvas{width:100%;height:100%;display:block;background:var(--cv);touch-action:none;cursor:crosshair}
#tip{position:absolute;display:none;pointer-events:none;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}
#elev{position:absolute;right:10px;top:10px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mu)}#elev:empty{display:none}
#hint{position:absolute;left:10px;bottom:10px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mu)}
@media(max-width:700px){main{flex-direction:column}aside{width:100%;max-height:42%;border-right:0;border-bottom:1px solid var(--bd)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body>
<header><h1>🗺️ City Mapper</h1><span>Roads, zones, buildings aur places draw karo — scroll = zoom, drag = pan</span></header>
<main>
<aside>
<div><h2>3D view</h2><div class="row"><button id="b3">🧊 3D mode</button><select id="ex" title="Height exaggeration"><option value="1">Height ×1</option><option value="2">Height ×2</option><option value="4">Height ×4</option></select></div></div>
<div><h2>Tool</h2><div class="tools" id="tools"></div></div>
<div><h2>Naam / Type</h2><input id="nm" placeholder="Naam (optional)"><div style="height:6px"></div><select id="kd"></select></div>
<div class="row"><button id="fin">Finish ⏎</button><button id="und">Undo</button><button id="del">Delete</button></div>
<label class="l"><input type="checkbox" id="sn" checked> Snap to 10 m grid</label><div class="row"><button id="fit">Fit view</button><button id="dup">Duplicate</button></div>
<div><h2>Layers</h2><div id="lay"></div></div>
<div><h2>3D lighting</h2><label class="st">Time of day <input type="range" id="tod" min="0" max="24" step="0.1" value="15"></label><label class="l"><input type="checkbox" id="auto"> Auto day-night cycle</label><label class="l"><input type="checkbox" id="shd" checked> Shadows</label></div>
<div><h2>Terrain</h2><select id="tm"><option value="raise">Raise</option><option value="lower">Lower</option><option value="smooth">Smooth</option><option value="flat">Flatten</option></select><label class="st">Brush size <input type="range" id="tr" min="40" max="400" value="120"></label><label class="st">Strength <input type="range" id="ts" min="1" max="15" value="5"></label><label class="st">Sea level <input type="range" id="tv" min="-20" max="80" value="0"></label><label class="st">Contour gap (m) <select id="ti"><option>5</option><option selected>10</option><option>20</option></select></label><div class="row" style="margin-top:6px"><button id="gen">Generate hills</button><button id="rst">Flat reset</button></div></div>
<div><h2>City stats</h2><div class="st" id="st"></div></div>
<div><h2>Save / Load (JSON)</h2><textarea id="js" placeholder="Export dabao ya JSON paste karke Import karo"></textarea><div class="row" style="margin-top:6px"><button id="ex">Export</button><button id="im">Import</button><button id="cl">Clear</button></div></div>
</aside>
<div id="wrap"><canvas id="cv"></canvas><canvas id="c3" style="display:none;cursor:grab"></canvas><div id="tip"></div><div id="elev"></div><div id="hint"></div></div>
</main>
<script>
const KINDS={
zone:{residential:'#f2d7a0',commercial:'#f4a6a6',industrial:'#b9b3c9',park:'#9fd18b',water:'#8cc4f0'},
building:{house:'#d9a066',shop:'#e57c7c',office:'#8aa4d6',school:'#e8c85a',hospital:'#f08fb0'},
road:{highway:'#e9884a',main:'#f2c14e',street:'#a8a69c'},
poi:{landmark:'⭐',food:'🍴',hospital:'🏥',school:'🎓',transit:'🚉',shop:'🛍️',park:'🌳'}};
const RW={highway:9,main:6,street:3};
const TOOLS=[['pan','✋ Select / Pan'],['road','🛣️ Road'],['zone','🟩 Zone'],['building','🏢 Building'],['poi','📍 Place'],['measure','📏 Measure'],['terrain','⛰️ Terrain']];
const HINT={pan:'Hover = info, click = select, feature drag = move, khali jagah drag = pan',road:'Click = point add, double-click / Finish = khatam',zone:'Click = corner add, double-click / Finish = band karo',building:'Do clicks: ek corner, doosra corner',poi:'Click karke place rakho',measure:'Points click karo = distance; double-click ya Finish = freeze, Esc = clear',terrain:'Drag karke paint karo: Raise / Lower / Smooth / Flatten (brush settings sidebar me)'};
let hov=null,mfrozen=false,F=[],view={x:60,y:60,z:1},tool='pan',cur=[],sel=null,hidden={},mouse=[0,0],drag=null,nid=1;
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// UI
TOOLS.forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.k=k;b.onclick=()=>setTool(k);$('tools').appendChild(b)});
['terrain','zone','building','road','poi'].forEach(l=>{const d=document.createElement('label');d.className='l';d.innerHTML='<input type="checkbox" checked> '+l;d.firstChild.onchange=e=>{hidden[l]=!e.target.checked;draw()};$('lay').appendChild(d)});
function fillKinds(t){$('kd').innerHTML=Object.keys(KINDS[t]).map(k=>`<option>${k}</option>`).join('')}
function setTool(k){cur=[];mfrozen=false;tool=k;sel=null;[...$('tools').children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('hint').textContent=HINT[k];if(k!=='pan'&&k!=='measure'&&k!=='terrain')fillKinds(k);draw()}
function save(){try{localStorage.setItem('citymap',JSON.stringify(F))}catch(e){}}
function load(){try{const s=localStorage.getItem('citymap');if(s)F=JSON.parse(s)}catch(e){}nid=F.reduce((m,f)=>Math.max(m,f.id),0)+1}
// geometry
const W=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-view.x)/view.z,(e.clientY-r.top-view.y)/view.z]};
const len=p=>p.reduce((s,q,i)=>i?s+Math.hypot(q[0]-p[i-1][0],q[1]-p[i-1][1]):0,0);
const area=p=>Math.abs(p.reduce((s,q,i)=>{const n=p[(i+1)%p.length];return s+q[0]*n[1]-n[0]*q[1]},0))/2;
function inPoly(pt,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>pt[1])!=(p[j][1]>pt[1])&&pt[0]<(p[j][0]-p[i][0])*(pt[1]-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c}return c}
function dSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1;let t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hit(pt){const tol=8/view.z;for(const t of['poi','road','building','zone']){if(hidden[t])continue;for(let i=F.length-1;i>=0;i--){const f=F[i];if(f.type!==t)continue;
if(t==='poi'&&Math.hypot(pt[0]-f.pts[0][0],pt[1]-f.pts[0][1])<14/view.z)return f;
if(t==='road'&&f.pts.some((q,k)=>k&&dSeg(pt,f.pts[k-1],q)<Math.max(tol,RW[f.kind]/2)))return f;
if((t==='building'||t==='zone')&&inPoly(pt,f.pts))return f}}return null}
// drawing
const cen=p=>[p.reduce((s,q)=>s+q[0],0)/p.length,p.reduce((s,q)=>s+q[1],0)/p.length];
const fm=d=>d>=1000?(d/1000).toFixed(2)+' km':Math.round(d)+' m';
const sn=p=>$('sn').checked?[Math.round(p[0]/10)*10,Math.round(p[1]/10)*10]:p;
const PAT={};
function mkPat(fn){const c=document.createElement('canvas');c.width=c.height=32;fn(c.getContext('2d'));return ctx.createPattern(c,'repeat')}
function pats(){PAT.park=mkPat(g=>{g.fillStyle='rgba(40,110,40,.45)';[[8,9,5],[22,8,4],[15,23,5],[28,26,3]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()})});PAT.water=mkPat(g=>{g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;g.beginPath();g.moveTo(0,10);g.quadraticCurveTo(8,4,16,10);g.quadraticCurveTo(24,16,32,10);g.moveTo(0,26);g.quadraticCurveTo(8,20,16,26);g.quadraticCurveTo(24,32,32,26);g.stroke()});PAT.industrial=mkPat(g=>{g.strokeStyle='rgba(60,50,90,.35)';g.lineWidth=2;g.beginPath();g.moveTo(0,32);g.lineTo(32,0);g.moveTo(-8,8);g.lineTo(8,-8);g.moveTo(24,40);g.lineTo(40,24);g.stroke()});PAT.commercial=mkPat(g=>{g.fillStyle='rgba(150,40,40,.3)';for(let x=4;x<32;x+=8)for(let y=4;y<32;y+=8)g.fillRect(x,y,2,2)});PAT.residential=mkPat(g=>{g.fillStyle='rgba(120,80,20,.25)';g.fillRect(6,6,3,3);g.fillRect(22,20,3,3)})}
function bld(f,c){let a=1e9,b=1e9,d=-1e9,e=-1e9;f.pts.forEach(q=>{a=Math.min(a,q[0]);d=Math.max(d,q[0]);b=Math.min(b,q[1]);e=Math.max(e,q[1])});const w=d-a,h=e-b;if(f.kind==='hospital'){const s=Math.min(w,h)*.28;ctx.fillStyle='#d32f2f';ctx.fillRect(c[0]-s,c[1]-s/3,2*s,2*s/3);ctx.fillRect(c[0]-s/3,c[1]-s,2*s/3,2*s)}else if(f.kind==='house'){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1/view.z;ctx.beginPath();if(w>=h){ctx.moveTo(a+w*.14,c[1]);ctx.lineTo(d-w*.14,c[1])}else{ctx.moveTo(c[0],b+h*.14);ctx.lineTo(c[0],e-h*.14)}ctx.stroke()}else{ctx.fillStyle='rgba(255,255,255,.65)';for(let x=a+w*.2;x<d-w*.2;x+=7)for(let y=b+h*.2;y<e-h*.2;y+=7)ctx.fillRect(x,y,3,3)}}
const TW=100,TH=80,TC=20,TX=-200,TY=-200,RAMP=[[0,[150,200,120]],[40,[205,212,130]],[90,[214,172,110]],[160,[168,128,98]],[240,[246,246,246]]];
let H=new Float32Array(TW*TH),tdirty=true,tcache=null,cont=null,contM=null,sea=0,tflat=true;
const hAt=(i,j)=>H[Math.max(0,Math.min(TH-1,j))*TW+Math.max(0,Math.min(TW-1,i))];
const flat=()=>sea===0&&H.every(v=>v===0);
function elevAt(p){const gx=(p[0]-TX)/TC-.5,gy=(p[1]-TY)/TC-.5,i=Math.floor(gx),j=Math.floor(gy),fx=gx-i,fy=gy-j;return(hAt(i,j)*(1-fx)+hAt(i+1,j)*fx)*(1-fy)+(hAt(i,j+1)*(1-fx)+hAt(i+1,j+1)*fx)*fy}
function saveH(){try{localStorage.setItem('citymapH',JSON.stringify(Array.from(H,v=>Math.round(v*10)/10)))}catch(e){}}
function loadH(){try{const s=localStorage.getItem('citymapH');if(s){const a=JSON.parse(s);if(a.length===H.length)H.set(a)}}catch(e){}}
function paint(p){const m=$('tm').value,r=+$('tr').value,s=+$('ts').value,ci=(p[0]-TX)/TC-.5,cj=(p[1]-TY)/TC-.5,rr=r/TC,tg=drag&&drag.tgt!=null?drag.tgt:elevAt(p);for(let j=Math.max(0,Math.floor(cj-rr));j<=Math.min(TH-1,Math.ceil(cj+rr));j++)for(let i=Math.max(0,Math.floor(ci-rr));i<=Math.min(TW-1,Math.ceil(ci+rr));i++){const d=Math.hypot(i-ci,j-cj);if(d>rr)continue;let w=1-d/rr;w=w*w*(3-2*w);const k=j*TW+i;if(m==='raise')H[k]+=s*w;else if(m==='lower')H[k]-=s*w;else if(m==='smooth'){const av=(hAt(i-1,j)+hAt(i+1,j)+hAt(i,j-1)+hAt(i,j+1))/4;H[k]+=(av-H[k])*Math.min(1,w*.6)}else H[k]+=(tg-H[k])*w*.5;H[k]=Math.max(-50,Math.min(300,H[k]))}tdirty=true}
function ramp(h){if(h<=RAMP[0][0])return RAMP[0][1];for(let k=1;k<RAMP.length;k++){if(h<=RAMP[k][0]){const a=RAMP[k-1],b=RAMP[k],t=(h-a[0])/(b[0]-a[0]);return a[1].map((v,n)=>v+(b[1][n]-v)*t)}}return RAMP[RAMP.length-1][1]}
function bakeT(){const c=tcache||(tcache=document.createElement('canvas'));c.width=TW;c.height=TH;const g=c.getContext('2d'),im=g.createImageData(TW,TH);let lo=1e9,hi=-1e9;for(let j=0;j<TH;j++)for(let i=0;i<TW;i++){const h=H[j*TW+i];lo=Math.min(lo,h);hi=Math.max(hi,h);const sh=Math.max(-.35,Math.min(.35,(hAt(i-1,j)-hAt(i+1,j)+hAt(i,j-1)-hAt(i,j+1))*.05));let col;if(h<sea){const d=Math.min(1,(sea-h)/25);col=[120-70*d,175-65*d,225-50*d]}else col=ramp(h);const o=(j*TW+i)*4;im.data[o]=col[0]*(1+sh);im.data[o+1]=col[1]*(1+sh);im.data[o+2]=col[2]*(1+sh);im.data[o+3]=255}g.putImageData(im,0,0);tflat=lo===0&&hi===0&&sea===0;cont=new Path2D();contM=new Path2D();const ci=+$('ti').value;for(let j=0;j<TH-1;j++)for(let i=0;i<TW-1;i++){const a=H[j*TW+i],b=H[j*TW+i+1],d=H[(j+1)*TW+i],c2=H[(j+1)*TW+i+1],mn=Math.min(a,b,c2,d),mx=Math.max(a,b,c2,d),x0=TX+(i+.5)*TC,x1=x0+TC,y0=TY+(j+.5)*TC,y1=y0+TC;for(let L=Math.ceil(mn/ci)*ci;L<=mx;L+=ci){const pts=[],ed=(v1,v2,ax,ay,bx,by)=>{if((v1-L)*(v2-L)<0){const t=(L-v1)/(v2-v1);pts.push([ax+(bx-ax)*t,ay+(by-ay)*t])}};ed(a,b,x0,y0,x1,y0);ed(b,c2,x1,y0,x1,y1);ed(d,c2,x0,y1,x1,y1);ed(a,d,x0,y0,x0,y1);const pth=Math.round(L/ci)%5===0?contM:cont;if(pts.length>=2){pth.moveTo(pts[0][0],pts[0][1]);pth.lineTo(pts[1][0],pts[1][1])}if(pts.length===4){pth.moveTo(pts[2][0],pts[2][1]);pth.lineTo(pts[3][0],pts[3][1])}}}}
function drawT(){if(hidden.terrain)return;if(tdirty){bakeT();tdirty=false}if(tflat)return;ctx.imageSmoothingEnabled=true;ctx.drawImage(tcache,TX,TY,TW*TC,TH*TC);ctx.lineJoin='round';ctx.strokeStyle='rgba(90,55,25,.4)';ctx.lineWidth=.8/view.z;ctx.stroke(cont);ctx.strokeStyle='rgba(90,55,25,.8)';ctx.lineWidth=1.6/view.z;ctx.stroke(contM)}
function elev(){const p=mouse,e=$('elev');if(p[0]<TX||p[0]>TX+TW*TC||p[1]<TY||p[1]>TY+TH*TC){e.textContent='';return}const h=elevAt(p);e.textContent='Elevation: '+h.toFixed(1)+' m'+(h<sea?' (water)':'')}
const c3=$('c3'),BH={house:7,shop:10,office:45,school:14,hospital:24};
let m3=false,R3=null,sc=null,cam=null,tgt=null,az=.8,pol=1,rad=1500;
function tex3(){const s=1.024,c=document.createElement('canvas');c.width=Math.round(TW*TC*s);c.height=Math.round(TH*TC*s);const g=c.getContext('2d');g.setTransform(s,0,0,s,-TX*s,-TY*s);if(tdirty){bakeT();tdirty=false}
if(tflat){g.fillStyle='rgb(150,200,120)';g.fillRect(TX,TY,TW*TC,TH*TC)}else{g.imageSmoothingEnabled=true;g.drawImage(tcache,TX,TY,TW*TC,TH*TC)}
const pa=p=>{g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]))};
if(!hidden.zone)for(const f of F){if(f.type!=='zone')continue;pa(f.pts);g.closePath();g.globalAlpha=.75;g.fillStyle=KINDS.zone[f.kind];g.fill();g.globalAlpha=1;if(PAT[f.kind]){g.fillStyle=PAT[f.kind];g.fill()}}
if(!hidden.road){g.lineJoin=g.lineCap='round';for(const f of F)if(f.type==='road'){pa(f.pts);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=RW[f.kind]+2;g.stroke()}
for(const f of F)if(f.type==='road'){pa(f.pts);g.strokeStyle=KINDS.road[f.kind];g.lineWidth=RW[f.kind];g.stroke();pa(f.pts);g.lineCap='butt';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=.9;g.setLineDash(f.kind==='highway'?[]:f.kind==='main'?[8,6]:[5,6]);g.stroke();g.setLineDash([]);g.lineCap='round'}}
return c}
function build3(){const ex=+$('ex').value,dark=matchMedia('(prefers-color-scheme: dark)').matches;
if(!R3){R3=new THREE.WebGLRenderer({canvas:c3,antialias:true});cam=new THREE.PerspectiveCamera(50,1,1,30000);tgt=new THREE.Vector3()}
if(sc)sc.traverse(o=>{if(o.geometry)o.geometry.dispose()});
sc=new THREE.Scene();sc.background=new THREE.Color(dark?0x1a2330:0xbcd7ee);
sc.add(new THREE.HemisphereLight(0xffffff,0x778899,.8));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(-800,1400,-500);sc.add(dl);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(40000,40000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:dark?0x23272b:0xdcd9cd}));gr.position.y=-2;sc.add(gr);
const g=new THREE.PlaneGeometry((TW-1)*TC,(TH-1)*TC,TW-1,TH-1);g.rotateX(-Math.PI/2);g.translate(TX+TW*TC/2,0,TY+TH*TC/2);const pos=g.attributes.position,uv=g.attributes.uv;
for(let k=0;k<pos.count;k++){pos.setY(k,H[k]*ex);uv.setXY(k,(pos.getX(k)-TX)/(TW*TC),1-(pos.getZ(k)-TY)/(TH*TC))}
g.computeVertexNormals();const tx=new THREE.CanvasTexture(tex3());tx.anisotropy=R3.capabilities.getMaxAnisotropy();sc.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:tx})));
